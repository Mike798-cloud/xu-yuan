<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>记录组合查询 - 只读节点</title><link rel="stylesheet" href="../assets/css/common.css"><link rel="stylesheet" href="../assets/css/oa.css"><script defer src="../assets/js/common.js"></script><script defer src="../assets/js/oa.js"></script></head><body class="site-oa oa-incidents"><div class="oa"><div class="oa-top"><span>MLU Legacy Record Node</span><span>READ ONLY</span></div><header class="oa-head"><h1>明岚大学历史记录只读节点</h1><p>迁移数据范围：2012-01-01 — 2016-12-31</p></header><nav class="oa-nav"><a href="index.html">节点首页</a><a href="incidents.html">组合查询</a><a href="duty.html">值班记录</a><a href="logs.html">系统日志</a><a href="scans.html">扫描件</a></nav><main class="oa-body"><div class="oa-panel"><h2>REC_QUERY / 结构化检索</h2><div class="inside"><p>日期格式 <span class="kbd">YYYY-MM-DD</span>。区域字段使用当年行政名称；空字段表示不限。</p><form class="oa-search" id="archiveQuery"><div class="query-grid"><div class="query-field"><label for="qDate">date</label><input id="qDate" name="date" type="text" inputmode="numeric" maxlength="10" placeholder="YYYY-MM-DD" autocomplete="off"></div><div class="query-field"><label for="qArea">area</label><select id="qArea" name="area"><option value="">不限区域</option><option value="oldgym">旧体育馆</option><option value="dorm3">3号宿舍楼</option><option value="radio">广播站 / 东区配电</option><option value="eastfield">东操场</option><option value="admin">行政楼</option></select></div><div><button class="query-submit" type="submit">[ENTER] 查询</button> <button id="queryReset" type="button">清空</button></div></div><p class="query-message" id="queryMessage">ready.</p></form><div class="query-results" id="queryResults" hidden><div class="result-head"><span id="queryEcho"></span><span><b id="queryCount">0</b> records</span></div><table class="oa-table"><thead><tr><th>record_id</th><th>date/time</th><th>area</th><th>source</th><th>summary</th></tr></thead><tbody id="queryBody"></tbody></table><p class="small muted">索引只返回原业务系统摘要；相同日期和区域不表示记录属于同一事件。</p></div></div></div></main></div></body></html>
